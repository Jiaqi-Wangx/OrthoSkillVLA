[project]
name = "orthoskillvla"
version = "0.1.0"
description = "Continual skill learning method for pretrained vision-language-action (VLA) models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.0",
    "json-numpy>=2.1.1",
    "msgpack>=1.1.2",
    "msgpack-numpy>=0.4.8",
    "peft>=0.18.1",
    "timm==1.0.12",
    "torch==2.7.1",
    "transformers==4.51.3",
    "tyro>=1.0.5",
    "uvicorn>=0.40.0",
    "websockets>=16.0",
]


[dependency-groups]
train = [
    "accelerate>=1.12.0",
    "lerobot==0.4.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "swanlab>=0.7.6",
]


[tool.ruff]
line-length = 120

[tool.setuptools]
packages = ["ortho_skill"]

# [[tool.uv.index]]
# url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
# default = true
